name: bull_and_bear
description: "Nepal stock market at a glance — a personal portfolio project."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  dio: ^5.8.0+1
  intl: ^0.20.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  package_info_plus: ^8.2.1
  connectivity_plus: ^6.1.3
  equatable: ^2.0.7
  base_kit:
    git:
      url: https://github.com/Repos-Assemble/base_kit.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon.png"
